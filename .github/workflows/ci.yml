name: ShopFlow - CI C

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilation:
    name: Compilation - ${{ matrix.compiler }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Compiler avec controles stricts
        env:
          CC: ${{ matrix.compiler }}
        run: |
          mkdir -p build
          "$CC" -std=c11 \
            -Wall -Wextra -Wpedantic -Werror \
            -g \
            -I . -I Catalogue-produit -I Clients -I Commandes \
            -I Statistiques -I Saisie-validation -I Initialisation \
            main.c Catalogue-produit/produit.c Clients/client.c \
            Commandes/commande.c Statistiques/statistique.c \
            Saisie-validation/utils.c Initialisation/initialisation.c \
            -o build/shopflow

  analyse-statique:
    name: Analyse statique Cppcheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Analyser le code
        run: |
          cppcheck \
            --enable=warning \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            -I . -I Catalogue-produit -I Clients -I Commandes \
            -I Statistiques -I Saisie-validation -I Initialisation \
            .

  memoire:
    name: Analyse memoire Valgrind
    runs-on: ubuntu-latest
    needs: compilation

    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valgrind

      - name: Compiler en mode debug
        run: |
          mkdir -p build
          gcc -std=c11 -g -O0 \
            -Wall -Wextra -Wpedantic \
            -I . -I Catalogue-produit -I Clients -I Commandes \
            -I Statistiques -I Saisie-validation -I Initialisation \
            main.c Catalogue-produit/produit.c Clients/client.c \
            Commandes/commande.c Statistiques/statistique.c \
            Saisie-validation/utils.c Initialisation/initialisation.c \
            -o build/shopflow

      - name: Tester les saisies invalides client et menu
        run: bash tests/test_input_validation.sh ./build/shopflow

      - name: Tester la creation client depuis le menu avec Valgrind
        run: |
          set -o pipefail
          printf '%s\n' \
            '2' '1' \
            'Bernard' 'Julie' 'julie@example.fr' '0612345678' \
            '12 rue de la Paix' 'Paris' '75002' 'France' \
            '2' '1' 'Martin' 'Julie' 'julie.updated@example.fr' '0711223344' \
            '5 avenue Victor Hugo' 'Lyon' '69002' 'France' \
            '4' '' '3' '2' '3' '3' '0' '0' \
            | timeout 30s valgrind \
            --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,possible \
            --error-exitcode=1 \
            ./build/shopflow \
            | tee build/menu-client.log
          grep -Fq "Client cree avec l'identifiant 6." build/menu-client.log
          grep -Fq 'Coordonnees et adresse du client mises a jour.' build/menu-client.log
          grep -Fq '1 | Martin Aline | aline.martin@example.fr | 2 | 142.41 EUR' build/menu-client.log
          grep -Fq '2 | Bernard Karim | karim.bernard@example.fr | 1 | 89.50 EUR' build/menu-client.log
          grep -Fq '6 | Martin Julie | julie.updated@example.fr | 0 | 0.00 EUR' build/menu-client.log
          grep -Fq 'Suppression refusee : ce client a une commande non annulee.' build/menu-client.log
          grep -Fq 'Client supprime (suppression logique).' build/menu-client.log

      - name: Tester le catalogue produits depuis le menu avec Valgrind
        run: |
          set -o pipefail
          printf '%s\n' \
            '1' '4' '' '0' '0' \
            | timeout 30s valgrind \
            --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,possible \
            --error-exitcode=1 \
            ./build/shopflow \
            | tee build/menu-produit.log
          grep -Fq 'Clavier mecanique' build/menu-produit.log
          grep -Fq 'Valeur du stock : 9866.30 EUR HT' build/menu-produit.log

  tests-unitaires-client-commande:
    name: Tests unitaires - clients et commandes
    runs-on: ubuntu-latest
    needs: compilation

    steps:
      - uses: actions/checkout@v4

      - name: Installer GCC et Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valgrind

      - name: Compiler les tests client
        run: |
          mkdir -p build
          gcc -std=c11 -g -O0 \
            -Wall -Wextra -Wpedantic -Werror \
            -I . -I Catalogue-produit -I Clients -I Commandes \
            Catalogue-produit/produit.c Clients/client.c Commandes/commande.c \
            Saisie-validation/utils.c Initialisation/initialisation.c \
            tests/test_client_creation.c \
            -o build/test_client_creation

      - name: Executer les tests client
        run: ./build/test_client_creation

      - name: Verifier les fuites memoire des tests client
        run: |
          valgrind --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,possible \
            --error-exitcode=1 \
            ./build/test_client_creation

  tests-unitaires-produits:
    name: Tests unitaires - produits
    runs-on: ubuntu-latest
    needs: compilation

    steps:
      - uses: actions/checkout@v4

      - name: Installer GCC et Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valgrind

      - name: Compiler les tests produits
        run: |
          mkdir -p build
          gcc -std=c11 -g -O0 \
            -Wall -Wextra -Wpedantic -Werror \
            -I . -I Catalogue-produit \
            Catalogue-produit/produit.c tests/test_produit.c \
            -o build/test_produit

      - name: Executer les tests produits
        run: ./build/test_produit

      - name: Verifier les fuites memoire des tests produits
        run: |
          valgrind --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,possible \
            --error-exitcode=1 \
            ./build/test_produit

  tests-unitaires-facturation:
    name: Tests unitaires - facturation
    runs-on: ubuntu-latest
    needs: compilation

    steps:
      - uses: actions/checkout@v4

      - name: Installer GCC et Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valgrind

      - name: Compiler les tests de facturation
        run: |
          mkdir -p build
          gcc -std=c11 -g -O0 \
            -Wall -Wextra -Wpedantic -Werror \
            -I . -I Clients -I Commandes \
            Commandes/commande.c Clients/client.c \
            Saisie-validation/utils.c \
            tests/test_commande_facturation.c \
            -o build/test_commande_facturation

      - name: Executer les tests de facturation
        run: ./build/test_commande_facturation

      - name: Verifier les fuites memoire des tests de facturation
        run: |
          valgrind --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,possible \
            --error-exitcode=1 \
            ./build/test_commande_facturation
