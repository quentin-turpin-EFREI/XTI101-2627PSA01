name: ShopFlow - CI C

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilation:
    name: Compilation - ${{ matrix.compiler }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Compiler avec controles stricts
        env:
          CC: ${{ matrix.compiler }}
        run: |
          mkdir -p build
          "$CC" -std=c11 \
            -Wall -Wextra -Wpedantic -Werror \
            -g \
            -I . -I Catalogue-produit -I Clients -I Commandes \
            -I Statistiques -I Saisie-validation -I Initialisation \
            main.c Catalogue-produit/produit.c Clients/client.c \
            Commandes/commande.c Statistiques/statistique.c \
            Saisie-validation/utils.c Initialisation/initialisation.c \
            -o build/shopflow

  analyse-statique:
    name: Analyse statique Cppcheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Analyser le code
        run: |
          cppcheck \
            --enable=warning \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            -I . -I Catalogue-produit -I Clients -I Commandes \
            -I Statistiques -I Saisie-validation -I Initialisation \
            .

  memoire:
    name: Analyse memoire Valgrind
    runs-on: ubuntu-latest
    needs: compilation

    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valgrind

      - name: Compiler en mode debug
        run: |
          mkdir -p build
          gcc -std=c11 -g -O0 \
            -Wall -Wextra -Wpedantic \
            -I . -I Catalogue-produit -I Clients -I Commandes \
            -I Statistiques -I Saisie-validation -I Initialisation \
            main.c Catalogue-produit/produit.c Clients/client.c \
            Commandes/commande.c Statistiques/statistique.c \
            Saisie-validation/utils.c Initialisation/initialisation.c \
            -o build/shopflow

      - name: Tester la creation client depuis le menu avec Valgrind
        run: |
          set -o pipefail
          printf '%s\n' \
            '6' 'Bernard' 'Julie' 'julie@example.fr' '0612345678' \
            '12 rue de la Paix' 'Paris' '75002' 'France' '0' \
            | timeout 30s valgrind \
            --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,possible \
            --error-exitcode=1 \
            ./build/shopflow \
            | tee build/menu-client.log
          grep -Fq "Client cree avec l'identifiant 1." build/menu-client.log

  tests-unitaires-client:
    name: Tests unitaires - creation client
    runs-on: ubuntu-latest
    needs: compilation

    steps:
      - uses: actions/checkout@v4

      - name: Installer GCC et Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valgrind

      - name: Compiler les tests client
        run: |
          mkdir -p build
          gcc -std=c11 -g -O0 \
            -Wall -Wextra -Wpedantic -Werror \
            -I . Clients/client.c tests/test_client_creation.c \
            -o build/test_client_creation

      - name: Executer les tests client
        run: ./build/test_client_creation

      - name: Verifier les fuites memoire des tests client
        run: |
          valgrind --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,possible \
            --error-exitcode=1 \
            ./build/test_client_creation
